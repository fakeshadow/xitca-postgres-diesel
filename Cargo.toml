[package]
name = "xitca-postgres-diesel"
version = "0.3.0"
edition = "2024"

[features]
default = ["instrumentation"]
instrumentation = []

[dependencies]
diesel = { version = "2", features = ["postgres", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
xitca-postgres = { version = "0.3.0", features = ["compat"] }

futures-core = { version = "0.3.31", default-features = false }
scoped-futures = "0.1.3"
tokio = { version = "1.40.0", features = ["sync"] }

[dev-dependencies]
diesel-async = { version = "0.7.3", features = ["bb8", "postgres"] }
futures-util = "0.3"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
xitca-postgres = { path = "../xitca-web/postgres" }
